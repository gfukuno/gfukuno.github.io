<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Documents</title>
  <!-- Gill Sansの代替としても機能するCabinおよびNoto Sans JPを事前読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --sub: #777777;
      --border: #eeeeee;
      --hover: #f9f9f9;
      --line: #222222;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      font-size: 20px; /* デフォルトフォントサイズを20pxに設定 */
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: "Gill Sans", "Gill Sans MT", "Cabin", "Noto Sans JP", sans-serif;
      line-height: 1.4;
      padding: 48px 24px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
      border-bottom: 1.5px solid var(--line);
      padding-bottom: 14px;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.2;
    }
    .file-count {
      font-size: 0.65rem;
      color: var(--sub);
      margin-top: 6px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 400;
    }
    .file-list {
      list-style: none;
    }
    .file-item {
      border-bottom: 1px solid var(--border);
    }
    .file-link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-decoration: none;
      color: inherit;
      padding: 13px 4px;
      transition: background-color 0.12s ease;
    }
    .file-link:hover {
      background-color: var(--hover);
    }
    .file-name {
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      word-break: break-all;
      padding-right: 20px;
      color: var(--text);
    }
    .file-meta {
      font-size: 0.62rem;
      color: var(--sub);
      white-space: nowrap;
      text-align: right;
      letter-spacing: 0.02em;
      font-weight: 400;
      font-family: "Gill Sans", "Gill Sans MT", "Cabin", sans-serif;
    }
    .file-size {
      margin-left: 10px;
    }
    .status-msg {
      font-size: 0.75rem;
      color: var(--sub);
      padding: 40px 0;
      text-align: center;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="classTitle">LOADING...</h1>
      <div id="fileCount" class="file-count"></div>
    </header>
    <main>
      <div id="status" class="status-msg">LOADING FILES...</div>
      <ul id="fileList" class="file-list"></ul>
    </main>
  </div>

  <script>
    // ★GAS WebアプリURL
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbw6U7-k90c7E93kS4B7LqG1qGZ2584z7e9g_YOUR_DEPLOY_ID/exec';

    function getTargetClass() {
      const hash = window.location.hash.replace(/^#/, '').trim();
      if (hash) return hash;
      const params = new URLSearchParams(window.location.search);
      return params.get('class');
    }

    async function loadDocuments() {
      const targetClass = getTargetClass();

      const titleEl = document.getElementById('classTitle');
      const countEl = document.getElementById('fileCount');
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('fileList');

      if (!targetClass) {
        titleEl.textContent = 'NO CLASS SPECIFIED';
        statusEl.textContent = 'URL hash "#classname" or parameter "?class=..." is required.';
        return;
      }

      try {
        const response = await fetch(`${GAS_API_URL}?class=${encodeURIComponent(targetClass)}`);
        const data = await response.json();

        if (data.error) {
          titleEl.textContent = targetClass.toUpperCase();
          statusEl.textContent = 'FOLDER NOT FOUND';
          return;
        }

        // config.txt 設定の動的反映
        if (data.config) {
          if (data.config.title) titleEl.textContent = data.config.title;
          else titleEl.textContent = (data.className || targetClass).toUpperCase();

          const fonts = [data.config.fontEn, data.config.fontJa].filter(Boolean).join(', ');
          if (fonts) document.body.style.fontFamily = fonts;
          if (data.config.fontSize) document.documentElement.style.fontSize = data.config.fontSize;
        } else {
          titleEl.textContent = (data.className || targetClass).toUpperCase();
        }

        countEl.textContent = `${data.files.length} ${data.files.length === 1 ? 'FILE' : 'FILES'}`;
        statusEl.style.display = 'none';

        if (data.files.length === 0) {
          statusEl.style.display = 'block';
          statusEl.textContent = 'NO PDF FILES AVAILABLE';
          return;
        }

        listEl.innerHTML = '';
        data.files.forEach(file => {
          const li = document.createElement('li');
          li.className = 'file-item';
          li.innerHTML = `
            <a href="${file.previewUrl}" target="_blank" rel="noopener noreferrer" class="file-link">
              <span class="file-name">${file.name}</span>
              <span class="file-meta">
                <span>${file.updated}</span>
                <span class="file-size">${file.size}</span>
              </span>
            </a>
          `;
          listEl.appendChild(li);
        });

      } catch (err) {
        titleEl.textContent = targetClass.toUpperCase();
        statusEl.textContent = 'FAILED TO LOAD FILES';
      }
    }

    window.addEventListener('hashchange', loadDocuments);
    loadDocuments();
  </script>
</body>
</html>
