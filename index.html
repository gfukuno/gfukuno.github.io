<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Documents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- デフォルトフォントの事前読み込み -->
  <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --sub: #777777;
      --border: #eeeeee;
      --hover: #f9f9f9;
      --line: #222222;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html {
      font-size: 24px; /* デフォルトサイズ */
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: "Cabin", "Gill Sans", "Gill Sans MT", "Noto Sans JP", sans-serif;
      line-height: 1.4;
      padding: 48px 24px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
      border-bottom: 1.5px solid var(--line);
      padding-bottom: 14px;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.2;
      /* 大文字強制を解除：入力した通りの文字で表示 */
    }
    .file-count {
      font-size: 0.65rem;
      color: var(--sub);
      margin-top: 6px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 400;
    }
    .file-list {
      list-style: none;
    }
    .file-item {
      border-bottom: 1px solid var(--border);
    }
    .file-link {
      display: block;
      text-decoration: none;
      color: inherit;
      padding: 14px 6px;
      transition: background-color 0.12s ease;
    }
    .file-link:hover {
      background-color: var(--hover);
    }
    .file-name {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      word-break: break-all;
      color: var(--text);
      line-height: 1.35;
    }
    .file-meta {
      font-size: 0.62rem;
      color: var(--sub);
      margin-top: 5px;
      letter-spacing: 0.02em;
      font-weight: 400;
      font-family: inherit;
    }
    .file-divider {
      margin: 0 6px;
      opacity: 0.6;
    }
    .status-msg {
      font-size: 0.75rem;
      color: var(--sub);
      padding: 40px 0;
      text-align: center;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="classTitle">LOADING...</h1>
      <div id="fileCount" class="file-count"></div>
    </header>
    <main>
      <div id="status" class="status-msg">LOADING FILES...</div>
      <ul id="fileList" class="file-list"></ul>
    </main>
  </div>

  <script>
    // ★ご自身のGAS WebアプリURL
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwiWIndSJ-myQYL0mrBUlLqlgxj2k0a8cqcvZywRgF3O9ze5A4ND4JGfZNRlBBVzOx9/exec';

    // Google Fontsを動的に読み込むヘルパー関数
    function loadGoogleFont(fontName) {
      if (!fontName) return;
      const cleanName = fontName.replace(/["']/g, '').trim();
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(cleanName)}:wght@300;400;500;700&display=swap`;
      document.head.appendChild(link);
    }

    function getTargetClass() {
      const hash = window.location.hash.replace(/^#/, '').trim();
      if (hash) return hash;
      const params = new URLSearchParams(window.location.search);
      return params.get('class');
    }

    async function loadDocuments() {
      const targetClass = getTargetClass();

      const titleEl = document.getElementById('classTitle');
      const countEl = document.getElementById('fileCount');
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('fileList');

      if (!targetClass) {
        titleEl.textContent = 'No Class Specified';
        statusEl.textContent = 'URL hash "#classname" or parameter "?class=..." is required.';
        return;
      }

      try {
        const response = await fetch(`${GAS_API_URL}?class=${encodeURIComponent(targetClass)}`);
        const data = await response.json();

        if (data.error) {
          titleEl.textContent = targetClass;
          statusEl.textContent = 'FOLDER NOT FOUND';
          return;
        }

        // 1. タイトルの反映（大文字変換せずそのまま表示）
        if (data.config && data.config.title) {
          titleEl.textContent = data.config.title;
        } else {
          titleEl.textContent = data.className || targetClass;
        }
          document.title = titleEl.textContent;
        
        // 2. config.txt によるフォント・スタイルの動的適用
        if (data.config) {
          if (data.config.fontEn) {
            const firstFont = data.config.fontEn.split(',')[0];
            loadGoogleFont(firstFont);
          }
          if (data.config.fontJa) {
            const firstFont = data.config.fontJa.split(',')[0];
            loadGoogleFont(firstFont);
          }

          const configuredFonts = [data.config.fontEn, data.config.fontJa]
            .filter(Boolean);
            
            if (configuredFonts.length > 0) {
              document.body.style.fontFamily =
                [...configuredFonts, 'sans-serif'].join(', ');
           }
          
          if (data.config.fontSize) document.documentElement.style.fontSize = data.config.fontSize;
        }

        countEl.textContent = `${data.files.length} ${data.files.length === 1 ? 'FILE' : 'FILES'}`;
        statusEl.style.display = 'none';

        if (data.files.length === 0) {
          statusEl.style.display = 'block';
          statusEl.textContent = 'NO PDF FILES AVAILABLE';
          return;
        }

        listEl.innerHTML = '';
        data.files.forEach(file => {
          const li = document.createElement('li');
          li.className = 'file-item';
          li.innerHTML = `
            <a href="${file.previewUrl}" target="_blank" rel="noopener noreferrer" class="file-link">
              <div class="file-name">${file.name}</div>
              <div class="file-meta">
                <span>${file.updated}</span>
                <span class="file-divider">|</span>
                <span class="file-size">${file.size}</span>
              </div>
            </a>
          `;
          listEl.appendChild(li);
        });

      } catch (err) {
        titleEl.textContent = targetClass;
        statusEl.textContent = 'FAILED TO LOAD FILES';
      }
    }

    window.addEventListener('hashchange', loadDocuments);
    loadDocuments();
  </script>
</body>
</html>
